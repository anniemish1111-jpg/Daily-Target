<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#315efb">
<title>Daily Target — Banking Exam</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182230;--muted:#6b7280;--line:#e5e7eb;--accent:#315efb;--soft:#eef2ff;--done:#16834b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 15px;position:sticky;top:0;z-index:3}.wrap{max-width:850px;margin:auto}
h1{margin:0;font-size:24px}.sub{color:var(--muted);margin-top:5px}.date{font-weight:700;color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin:15px 0;box-shadow:0 2px 10px #00000008}
.progress{height:11px;background:#e9edf5;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:var(--accent);transition:.2s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--soft);border-radius:12px;padding:11px;text-align:center}.stat b{display:block;font-size:21px}
label{display:block;font-weight:650;margin:12px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:75px;resize:vertical}
.task{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.task input{width:20px;height:20px;flex:none}.task.done{background:#eaf8f0;border-color:#b9e4ca}.task.done .tasktext{text-decoration:line-through;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef0f4}.danger{background:#fff0f0;color:#b42318}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}small{color:var(--muted)}
@media(max-width:600px){.row{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Daily Target</h1><div class="sub"><span class="date" id="today"></span> · Banking Exam Preparation</div><div class="progress"><div class="bar" id="bar"></div></div><small id="completion">0% complete</small></div></header>
<main class="wrap">
<section class="card"><h2>Today's Targets</h2><div id="tasks"></div>
<label>Add a target</label><div class="row"><input id="newTask" placeholder="e.g. 30 DI questions"><button class="primary" onclick="addTask()">Add target</button></div></section>

<section class="card"><h2>Today's Performance</h2><div class="stats">
<div class="stat"><b id="doneCount">0</b><small>Done</small></div><div class="stat"><b id="targetCount">0</b><small>Targets</small></div><div class="stat"><b id="accuracyView">—</b><small>Accuracy</small></div></div>
<div class="row"><div><label>Questions attempted</label><input id="attempted" type="number" min="0"></div><div><label>Correct</label><input id="correct" type="number" min="0"></div></div>
<div class="row"><div><label>Study time (minutes)</label><input id="minutes" type="number" min="0"></div><div><label>Mock/Test score</label><input id="score" placeholder="e.g. 72/100"></div></div>
<label>Notes / mistakes to revisit</label><textarea id="notes" placeholder="What went well? What needs revision?"></textarea>
<div class="actions"><button class="primary" onclick="save()">Save today's record</button></div><small id="saved"></small></section>

<section class="card"><h2>Progress History</h2><div id="history"></div>
<div class="actions"><button class="secondary" onclick="exportData()">Export records</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import records</button><input id="importFile" type="file" accept=".json" hidden onchange="importData(event)"></div>
<small>Records stay in this browser. Export a backup if you change phone/browser.</small></section>
</main>

<script>
const KEY="bankingDailyTracker_v1";
const defaults=["Quant — daily practice","Reasoning — daily practice","English — daily practice","GA / Banking Awareness — daily revision","Mock / sectional test"];
const key=()=>new Date().toISOString().slice(0,10);
const pretty=k=>new Date(k+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function db(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
function today(){let x=db(),k=key();if(!x[k]){x[k]={tasks:defaults.map((text,i)=>({text,done:false,id:Date.now()+i})),attempted:"",correct:"",minutes:"",score:"",notes:""};localStorage.setItem(KEY,JSON.stringify(x))}return x[k]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
 let x=today(),k=key();document.getElementById("today").textContent=pretty(k);
 document.getElementById("tasks").innerHTML=x.tasks.map((t,i)=>`<div class="task ${t.done?"done":""}"><input type="checkbox" ${t.done?"checked":""} onchange="toggle(${i})"><div class="tasktext" style="flex:1">${esc(t.text)}</div><button class="danger" onclick="del(${i})">×</button></div>`).join("");
 ["attempted","correct","minutes","score","notes"].forEach(id=>document.getElementById(id).value=x[id]||""); stats();history()
}
function fields(){let x=db()[key()];["attempted","correct","minutes","score","notes"].forEach(id=>x[id]=document.getElementById(id).value);let d=db();d[key()]=x;localStorage.setItem(KEY,JSON.stringify(d))}
function save(){fields();document.getElementById("saved").textContent="✓ Saved at "+new Date().toLocaleTimeString();stats();history()}
function toggle(i){let d=db();d[key()].tasks[i].done=!d[key()].tasks[i].done;localStorage.setItem(KEY,JSON.stringify(d));render()}
function del(i){let d=db();d[key()].tasks.splice(i,1);localStorage.setItem(KEY,JSON.stringify(d));render()}
function addTask(){let e=document.getElementById("newTask"),t=e.value.trim();if(!t)return;let d=db();d[key()].tasks.push({text:t,done:false,id:Date.now()});localStorage.setItem(KEY,JSON.stringify(d));e.value="";render()}
function stats(){let x=today(),n=x.tasks.length,done=x.tasks.filter(t=>t.done).length,p=n?Math.round(done/n*100):0,a=+x.attempted,c=+x.correct;document.getElementById("doneCount").textContent=done;document.getElementById("targetCount").textContent=n;document.getElementById("bar").style.width=p+"%";document.getElementById("completion").textContent=p+"% complete";document.getElementById("accuracyView").textContent=a?Math.round(c/a*100)+"%":"—"}
function history(){let d=db(),ks=Object.keys(d).sort().reverse();document.getElementById("history").innerHTML=ks.length?`<table><tr><th>Date</th><th>Completion</th><th>Accuracy</th><th>Time</th><th>Score</th></tr>${ks.map(k=>{let x=d[k],n=x.tasks.length,z=x.tasks.filter(t=>t.done).length,a=+x.attempted;return`<tr><td>${pretty(k)}</td><td>${n?Math.round(z/n*100):0}%</td><td>${a?Math.round((+x.correct/a)*100)+"%":"—"}</td><td>${x.minutes||0} min</td><td>${esc(x.score||"—")}</td></tr>`}).join("")}</table>`:"<small>No records yet.</small>"}
function exportData(){let b=new Blob([JSON.stringify(db(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="banking-daily-progress.json";a.click()}
function importData(e){let r=new FileReader();r.onload=()=>{try{localStorage.setItem(KEY,JSON.stringify(JSON.parse(r.result)));render();alert("Records imported.")}catch(_){alert("Invalid backup file.")}};r.readAsText(e.target.files[0])}
["attempted","correct","minutes","score","notes"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{fields();stats()}));
render();
</script>
</body>
</html>
